services:
  dapple:
    image: afraley/dapple:latest
    pull_policy: always  # fetch the newest image on every `docker compose up`
    container_name: dapple
    environment:
      - PUID=1000        # on Linux, what `id -u` prints — the owner of ./data
      - PGID=1000        # on Linux, what `id -g` prints
      - TZ=Etc/UTC       # e.g. America/Chicago, for log timestamps
    volumes:
      - ./data:/data:z   # :z is for SELinux (Fedora, RHEL); ignored everywhere else
    ports:
      - 8080:8080
    restart: unless-stopped
