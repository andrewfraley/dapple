services:
  dapple:
    image: andrewfraley/dapple:latest
    # Compose pulls the published image; `docker compose up -d --build` builds
    # this checkout instead.
    build: .
    container_name: dapple
    restart: unless-stopped
    ports:
      - "${DAPPLE_PORT:-8080}:8080"
    volumes:
      - ./data:/data:z
    user: "${DAPPLE_UID:-1000}:${DAPPLE_GID:-1000}"
