# Only in a checkout of the repo; Compose merges it into docker-compose.yml
# automatically. `docker compose up -d --build` builds this source instead of
# pulling the published image.
services:
  dapple:
    build: .
    # Lets a dev instance sit beside a real one: DAPPLE_PORT=8081 in .env.
    ports: !override
      - "${DAPPLE_PORT:-8080}:8080"
