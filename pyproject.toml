[project]
name = "dapple"
version = "0.4.0"
description = "Static multi-color patterns for Twinkly light strands, with a REST API for Home Assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "xled>=0.7.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "aiomqtt>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "black==26.5.1",  # the same pin as .pre-commit-config.yaml, so CI and the hook agree
    "pre-commit>=3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.black]
# Matches Prettier's print width in frontend/, so both halves wrap alike.
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Only Starlette's notice that TestClient wants a different httpx; anything
# else deprecated should show up.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
