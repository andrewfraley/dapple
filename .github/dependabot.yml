# Everything is pinned (SHAs, hashes, digests), so nothing updates on its own.
# Dependabot opens a PR for each update; read the lock diff before merging,
# since a hash only proves you got the version you asked for, not that the
# version is safe.
#
# Security fixes only. `open-pull-requests-limit: 0` switches off routine
# version updates for an ecosystem; security updates are a separate feature
# (Settings → Code security) with their own limit, and still arrive as soon as
# an advisory has a fix. Taking newer versions otherwise is a deliberate
# upgrade PR (`uv lock --upgrade`, `npm update`).
#
# Nothing is ignored on these: an `ignore` by dependency name blocks security
# updates too, and a fix should always be proposed.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      actions:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    # Every range in pyproject.toml is open-ended (>=), so a fix fits without
    # touching it; only the lock changes.
    versioning-strategy: lockfile-only
    groups:
      python:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    versioning-strategy: increase-if-necessary
    groups:
      frontend:
        applies-to: security-updates
        patterns: ["*"]

  # The one ecosystem left on version updates: Dependabot has no security
  # updates for images, and a pinned digest never picks up the OS fixes in a
  # rebuilt python:3.12-slim on its own. Only new digests for the same tag;
  # moving to a new Python or Node version is a deliberate change. Merging this
  # PR changes nothing for users until a release, so follow it with a patch
  # release.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      images:
        patterns: ["*"]
