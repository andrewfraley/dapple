# Everything is pinned (SHAs, hashes, digests), so nothing updates on its own.
# Dependabot opens a PR for each update; read the lock diff before merging,
# since a hash only proves you got the version you asked for, not that the
# version is safe.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      # Minor and patch releases together; majors (MUI, React, Vite) one at a time.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
