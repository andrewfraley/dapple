name: Build and publish

# Releases happen when a person merges a pull request to main. If main's
# pyproject.toml has a version with no tag yet, the main build publishes the
# image as that version, then tags it and creates the GitHub release from
# docs/releases/<version>.md. The release job tags it itself because a tag
# pushed with the workflow's own token doesn't start another run.

on:
  push:
    # Every branch builds, so a feature branch can be pulled and tried on real
    # strands before it merges. Only main moves `latest`.
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Every action is pinned to a full commit SHA, with its version in a comment.
# A tag like @v7 can be moved to other code; a SHA can't. Dependabot proposes
# updates (.github/dependabot.yml), and the repository requires SHA pins.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      minor: ${{ steps.version.outputs.minor }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Runs on pull requests too, so a missing release note blocks the merge
      # instead of failing after the image is already published.
      - id: version
        name: Check the version and its release notes
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          ui=$(python3 -c 'import json; print(json.load(open("frontend/package.json"))["version"])')
          if [ "$version" != "$ui" ]; then
            echo "::error::pyproject.toml says $version but frontend/package.json says $ui. Bump both."
            exit 1
          fi
          release=false
          if ! git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            release=true
            if [ ! -f "docs/releases/$version.md" ]; then
              echo "::error::$version has no tag yet, so merging this to main releases it. Add its release notes as docs/releases/$version.md."
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # The same versions the image installs, from uv.lock. setup-uv verifies
      # the uv download's checksum; `pip install uv` would take any wheel.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.9"
      - run: uv lock --check
      - run: uv sync --frozen --extra dev
      - run: .venv/bin/black --check .
      - run: .venv/bin/python -m pytest -q

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run format:check
      - run: npm --prefix frontend test

  image:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      pushed: ${{ steps.pushed.outputs.pushed }}
    env:
      IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/dapple
      # Pull requests and forks have no Docker Hub credentials; they still
      # build, so a broken Dockerfile shows up before merge.
      PUSH: ${{ github.event_name != 'pull_request' && vars.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
      # A push to main (a merged PR) whose version has no tag yet: this build is the release.
      RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test.outputs.release == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: github.event_name != 'pull_request' && env.PUSH != 'true'
        run: echo "::warning::Not publishing to Docker Hub — set the DOCKERHUB_USERNAME variable and DOCKERHUB_TOKEN secret."

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.PUSH == 'true'
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE != '/dapple' && env.IMAGE || 'dapple' }}
          # main → latest; v1.2.3 → 1.2.3 and 1.2; any other branch → its own name
          # (slashes become dashes). Every build also gets its commit sha. A branch
          # build can never move `latest` or a version tag.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch,enable=${{ github.ref_name != github.event.repository.default_branch }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=${{ needs.test.outputs.version }},enable=${{ env.RELEASE }}
            type=raw,value=${{ needs.test.outputs.minor }},enable=${{ env.RELEASE }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - id: pushed
        run: echo "pushed=$PUSH" >> "$GITHUB_OUTPUT"

  release:
    needs: [test, image]
    # Only once the versioned image is really on Docker Hub, so a release never
    # points at an image that doesn't exist.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.test.outputs.release == 'true' && needs.image.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag v${{ needs.test.outputs.version }} and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.test.outputs.version }}
        run: >-
          gh release create "v$VERSION" --target "$GITHUB_SHA"
          --title "Dapple $VERSION" --notes-file "docs/releases/$VERSION.md"

