name: Build and publish

on:
  push:
    # Every branch builds, so a feature branch can be pulled and tried on real
    # strands before it merges. Only main moves `latest`.
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The same versions the image installs, from uv.lock.
      - run: pip install uv==0.12.9
      - run: uv sync --frozen --extra dev
      - run: .venv/bin/black --check .
      - run: .venv/bin/python -m pytest -q

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run format:check
      - run: npm --prefix frontend test

  image:
    needs: test
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/dapple
      # Pull requests and forks have no Docker Hub credentials; they still
      # build, so a broken Dockerfile shows up before merge.
      PUSH: ${{ github.event_name != 'pull_request' && vars.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      - if: github.event_name != 'pull_request' && env.PUSH != 'true'
        run: echo "::warning::Not publishing to Docker Hub — set the DOCKERHUB_USERNAME variable and DOCKERHUB_TOKEN secret."

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: env.PUSH == 'true'
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE != '/dapple' && env.IMAGE || 'dapple' }}
          # main → latest; v1.2.3 → 1.2.3 and 1.2; any other branch → its own name
          # (slashes become dashes). Every build also gets its commit sha. A branch
          # build can never move `latest` or a version tag.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch,enable=${{ github.ref_name != github.event.repository.default_branch }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
